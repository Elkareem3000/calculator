<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>HTML | CALCULATOR</title>
</head>

<body>

	<form a style="width: 400px;">
		<input type="button" style="width: 196px; height: 40px; background-color: #ffffff; border: 1px solid #ccc; "  id="screen">

		<div style="padding: 8px 0px;">
			<input type="button" name="" value="1" style="width: 40px; height: 40px; margin-right: 8px; text-align: center; " onclick="displayValue('1')">
			<input type="button" name="" value="2" style="width: 40px; height: 40px; margin-right: 8px; text-align: center;" onclick="displayValue('2')">
			<input type="button" name="" value="3" style="width: 40px; height: 40px; margin-right: 8px; text-align: center;" onclick="displayValue('3')">
			<input type="button" name="" value="4" style="width: 40px; height: 40px; text-align: center;" onclick="displayValue('4')">
		</div>

		<div style="padding: 8px 0px;">
			<input type="button" name="" value="5" style="width: 40px; height: 40px; margin-right: 8px; text-align: center;;" onclick="displayValue('5')">
			<input type="button" name="" value="6" style="width: 40px; height: 40px; margin-right: 8px; text-align: center;" onclick="displayValue('6')">
			<input type="button" name="" value="7" style="width: 40px; height: 40px; margin-right: 8px; text-align: center;" onclick="displayValue('7')">
			<input type="button" name="" value="8" style="width: 40px; height: 40px; text-align: center;" onclick="displayValue('8')">
		</div>

		<div style="padding: 8px 0px;">
			<input type="button" name="" value="9" style="width: 40px; height: 40px; margin-right: 8px; text-align: center;;" onclick="displayValue('9')">
			<input type="button" name="" value="0"style="width: 40px; height: 40px; margin-right: 8px; text-align: center;" onclick="displayValue('0')">
			<input type="button" name="" value="+" style="width: 40px; height: 40px; margin-right: 8px; text-align: center;" onclick="displayValue('+')">
			<input type="button" name="" value="X" style="width: 40px; height: 40px; text-align: center;" onclick="displayValue('X')">
		</div>

		<div style="padding: 8px 0px;">
			<input type="button" name="" value="-" style="width: 40px; height: 40px; margin-right: 8px; text-align: center;" onclick="displayValue('-')">
			<input type="button" name="" value="/" style="width: 40px; height: 40px; margin-right: 8px; text-align: center;" onclick="displayValue('/')">
			<input type="button" name="" value="C" style="width: 40px; height: 40px;" onclick="clearScreen()">
			<input type="button" name="" value="=" style="width: 40px; height: 40px;" >


		</div>
	</form>


	<script>

		function displayValue(value) {
			var oldScreenValue = document.getElementById('screen').value;
			document.getElementById('screen').value = oldScreenValue + value;
	
		}

		function clearScreen(){
			document.getElementById('screen').value = '';
		}
	</script>
	
</body>

</html>
